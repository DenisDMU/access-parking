# Pipeline CI d'Access : chaque push/PR doit passer TOUS les jobs ci-dessous.
# Les jobs s'enchaînent en file (`needs`) : lint → tests → bandit →
# pip-audit → gitleaks. Une étape en échec arrête la suite (les suivantes
# sont "skipped") : on corrige d'abord le plus simple avant d'aller plus loin.
# Render est configuré en "Auto-Deploy : After CI Checks Pass" : un commit
# sur main n'est déployé que si l'ensemble de ces vérifications est vert.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Principe du moindre privilège : le token GitHub n'a que la lecture du code.
permissions:
  contents: read

# Un nouveau push sur la même branche annule le run précédent devenu inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check src tests --output-format=github
      # Formatage homogène : échoue si un fichier n'est pas formaté (corriger avec `ruff format src tests`)
      - run: ruff format --check src tests

  tests:
    name: Tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      # Aucun secret nécessaire : les tests tournent sur SQLite en mémoire
      # avec tous les services externes mockés/doublés.
      - run: pytest -v

  sast:
    name: Sécurité du code (bandit)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: bandit -r src

  dependencies:
    name: Vulnérabilités des dépendances (pip-audit)
    needs: sast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt

  secrets:
    name: Détection de secrets (gitleaks)
    needs: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # tout l'historique : un secret supprimé reste dans git
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
