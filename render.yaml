# Render Blueprint — voir https://render.com/docs/blueprint-spec
#
# Déploie 1 seul service pour l'instant :
#   - access-api : le microservice Access (FastAPI), public, plan Free.
#
# Publication d'événements en mode "rabbitmq", via un broker EXTERNE hébergé
# (CloudAMQP) — pas de service Render supplémentaire, donc pas de coût
# additionnel côté Render. Access publie sur l'exchange partagé de l'équipe
# "microservice-event-bus" (routing keys access.entry/access.exit/access.refused).
#
# ⚠️ RABBITMQ_URL n'est PAS généré automatiquement par Render (ce n'est pas
# un secret que Render peut inventer lui-même, contrairement à API_KEY) :
# `sync: false` ci-dessous fait juste apparaître la variable comme "à
# renseigner" dans Render > access-api > Environment — colle-la-toi-même
# une fois le service créé (valeur au format
# amqps://user:pass@host/vhost, fournie par CloudAMQP). Le service ne
# publiera aucun événement tant que cette variable est vide (ça n'empêche
# pas le reste de l'API de fonctionner, cf. best-effort de la spec).
#
# Ancienne option (RabbitMQ auto-hébergé en service privé Render) laissée en
# commentaire tout en bas — plus nécessaire maintenant qu'on a un broker
# externe gratuit, mais utile si CloudAMQP devait un jour être abandonné.
#
# Autres points à vérifier (voir README section "Déploiement sur Render") :
#   - Plan Free : disque éphémère (la base SQLite est réinitialisée à
#     chaque redéploiement/redémarrage) et mise en veille après 15 min
#     d'inactivité (premier appel après veille plus lent, cold start).
#   - API_KEY est généré automatiquement par Render à la création du
#     service — va le récupérer dans Render > access-api > Environment
#     avant de configurer Postman.

services:
  - type: web
    name: access-api
    env: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "pip install -r requirements.txt"
    # --no-access-log : Access écrit son propre log d'accès, avec correlation ID
    # (src/interfaces/api/middleware.py) — évite les lignes en double.
    startCommand: "uvicorn src.interfaces.api.main:app --host 0.0.0.0 --port $PORT --no-access-log"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: API_KEY
        generateValue: true
      - key: BORNE_API_KEY
        # Clé des bornes client (/borne) : n'autorise que le passage d'un
        # véhicule. Générée par Render, à saisir dans les réglages de la borne.
        generateValue: true
      - key: METRICS_TOKEN
        # Jeton de lecture de GET /metrics, pour le Prometheus qui supervise
        # Access : il ne donne accès à aucune autre route. Généré par Render.
        generateValue: true
      - key: BORNE_PUBLIC
        # true : le lien /borne marche pour tous, sans clé, via la route
        # publique POST /api/v1/borne/passages (passage seulement, date
        # imposée, 10/min par adresse). false : la borne exige sa clé.
        value: "true"
      - key: AGENT_CODE
        # Code saisi par l'agent sur la borne pour valider un PMR (carte
        # mobilité inclusion vérifiée). Volontairement simple : démonstration.
        value: "123"
      - key: DATABASE_URL
        # Base Postgres hébergée (Neon) : URL secrète, saisie dans Render >
        # Environment, jamais versionnée. sync: false empêche le blueprint
        # d'écraser la valeur. Vide → SQLite local, EFFACÉ à chaque
        # redémarrage du plan Free (disque éphémère).
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        # Liste blanche des origines navigateur autorisées (séparées par des
        # virgules). Le dashboard est same-origin et n'en a pas besoin ;
        # ajouter ici l'URL d'un front d'équipe si un jour il appelle Access.
        value: "https://access-api-a1u7.onrender.com"
      - key: BOOKING_USE_MOCK
        # Booking est réel depuis le 24/11 (USE_MOCKS n'a plus d'effet).
        value: "false"
      - key: VEHICLES_SERVICE_URL
        # Service reel de l'equipe branche - mock supprime du code, aucune
        # bascule possible pour ce service (voir README section 5/16).
        value: https://parking-vehicles.onrender.com
      - key: BOOKING_SERVICE_URL
        # Service réel de l'équipe (si une ancienne valeur localhost reste dans
        # Render, Access l'ignore et utilise cette URL).
        value: https://booking-api-vhy5.onrender.com
      - key: PARKING_SERVICE_URL
        # Service reel de l'equipe branche - mock supprime du code, aucune
        # bascule possible pour ce service (voir README section 5/16).
        value: https://parking-6r73.onrender.com
      - key: PRICING_SERVICE_URL
        # Service reel de l'equipe branche - mock supprime du code,
        # aucune bascule possible pour ce service (voir README section 5/16).
        value: https://pricing-9khk.onrender.com
      - key: PAYMENT_SERVICE_URL
        # Service reel de l'equipe branche - mock supprime du code,
        # aucune bascule possible pour ce service (voir README section 5/16).
        value: https://payment-xp8n.onrender.com
      - key: PAYMENT_API_KEY
        sync: false  # secret fourni en privé par l'équipe Payment : à coller dans Render > Environment
      - key: PARKING_API_KEY
        sync: false  # OBLIGATOIRE : Parking exige X-API-Key depuis le 18/11 — clé à demander à l'équipe Parking
      - key: PRICING_API_KEY
        sync: false  # optionnel tant que Pricing n'a pas activé son authentification
      - key: VEHICLES_API_KEY
        sync: false  # optionnel tant que Vehicles n'a pas activé son authentification
      - key: AI_MODEL_NAME
        value: fake-vision-v1
      - key: EVENT_SUBSCRIBERS_URLS
        value: ""
      - key: EVENT_PUBLISH_TIMEOUT_MS
        value: "1000"
      - key: RATE_LIMIT_ACCESS_REQUESTS
        value: "20/minute"
      - key: EVENT_PUBLISHER
        value: rabbitmq
      - key: RABBITMQ_EXCHANGE
        value: microservice-event-bus
      - key: RABBITMQ_URL
        sync: false  # secret : à coller manuellement dans Render > Environment (voir note en haut de fichier)

# --- Ancienne option : RabbitMQ auto-hébergé sur Render (service privé) -----
# Laissée en commentaire — plus utilisée depuis qu'on a un broker externe
# (CloudAMQP) gratuit. Pour y revenir un jour : décommenter ce service, et
# remplacer la valeur de RABBITMQ_URL ci-dessus par
# amqp://guest:guest@access-rabbitmq:5672/%2F (plus besoin de sync: false
# dans ce cas, ce ne serait plus un secret externe).
#
#  - type: pserv
#    name: access-rabbitmq
#    env: image
#    plan: starter
#    region: frankfurt
#    image:
#      url: docker.io/library/rabbitmq:3-management
