# Render Blueprint — voir https://render.com/docs/blueprint-spec
#
# Déploie 1 seul service pour l'instant :
#   - access-api : le microservice Access (FastAPI), public, plan Free.
#
# Publication d'événements en mode "webhook" (fan-out HTTP, sans broker,
# gratuit — cf. section 3 point 3 de la spec) : suffisant tant que personne
# n'écoute encore, `EVENT_SUBSCRIBERS_URLS` reste vide par défaut.
#
# RabbitMQ (service privé `pserv`) volontairement PAS déployé pour l'instant
# — un service privé Render nécessite en général un plan payant. Le code est
# déjà prêt (`src/infrastructure/events/rabbitmq_event_publisher.py`) : pour
# l'activer plus tard, voir le bloc commenté en bas de ce fichier, à
# décommenter, plus `EVENT_PUBLISHER=rabbitmq` et `RABBITMQ_URL` à ajouter
# dans les envVars de `access-api` ci-dessous (voir README section
# "Publication d'événements : webhook ou RabbitMQ").
#
# ⚠️ Autres points à vérifier (voir README section "Déploiement sur Render") :
#   - Plan Free : disque éphémère (la base SQLite est réinitialisée à
#     chaque redéploiement/redémarrage) et mise en veille après 15 min
#     d'inactivité (premier appel après veille plus lent, cold start).
#   - API_KEY est généré automatiquement par Render à la création du
#     service — va le récupérer dans Render > access-api > Environment
#     avant de configurer Postman.

services:
  - type: web
    name: access-api
    env: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.interfaces.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./access.db
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: USE_MOCKS
        value: "true"
      - key: VEHICLES_SERVICE_URL
        value: http://localhost:8001
      - key: BOOKING_SERVICE_URL
        value: http://localhost:8002
      - key: PARKING_SERVICE_URL
        value: http://localhost:8003
      - key: PRICING_SERVICE_URL
        value: http://localhost:8004
      - key: PAYMENT_SERVICE_URL
        value: http://localhost:8005
      - key: AI_MODEL_NAME
        value: fake-vision-v1
      - key: EVENT_SUBSCRIBERS_URLS
        value: ""
      - key: EVENT_PUBLISH_TIMEOUT_MS
        value: "1000"
      - key: RATE_LIMIT_ACCESS_REQUESTS
        value: "20/minute"
      - key: EVENT_PUBLISHER
        value: webhook

# --- RabbitMQ (désactivé pour l'instant, cf. note en haut de fichier) -------
# Pour activer plus tard : décommenter ce service, ajouter dans les envVars
# de access-api ci-dessus :
#   - key: EVENT_PUBLISHER
#     value: rabbitmq
#   - key: RABBITMQ_URL
#     value: amqp://guest:guest@access-rabbitmq:5672/%2F
