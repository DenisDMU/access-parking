# Render Blueprint — voir https://render.com/docs/blueprint-spec
#
# Déploie 1 seul service pour l'instant :
#   - access-api : le microservice Access (FastAPI), public, plan Free.
#
# Publication d'événements en mode "rabbitmq", via un broker EXTERNE hébergé
# (CloudAMQP) — pas de service Render supplémentaire, donc pas de coût
# additionnel côté Render. Access publie sur l'exchange partagé de l'équipe
# "microservice-event-bus" (routing keys access.entry/access.exit/access.refused).
#
# ⚠️ RABBITMQ_URL n'est PAS généré automatiquement par Render (ce n'est pas
# un secret que Render peut inventer lui-même, contrairement à API_KEY) :
# `sync: false` ci-dessous fait juste apparaître la variable comme "à
# renseigner" dans Render > access-api > Environment — colle-la-toi-même
# une fois le service créé (valeur au format
# amqps://user:pass@host/vhost, fournie par CloudAMQP). Le service ne
# publiera aucun événement tant que cette variable est vide (ça n'empêche
# pas le reste de l'API de fonctionner, cf. best-effort de la spec).
#
# Ancienne option (RabbitMQ auto-hébergé en service privé Render) laissée en
# commentaire tout en bas — plus nécessaire maintenant qu'on a un broker
# externe gratuit, mais utile si CloudAMQP devait un jour être abandonné.
#
# Autres points à vérifier (voir README section "Déploiement sur Render") :
#   - Plan Free : disque éphémère (la base SQLite est réinitialisée à
#     chaque redéploiement/redémarrage) et mise en veille après 15 min
#     d'inactivité (premier appel après veille plus lent, cold start).
#   - API_KEY est généré automatiquement par Render à la création du
#     service — va le récupérer dans Render > access-api > Environment
#     avant de configurer Postman.

services:
  - type: web
    name: access-api
    env: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn src.interfaces.api.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.1
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./access.db
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: USE_MOCKS
        # Valeur par défaut pour les 5 services. Dès qu'un camarade a un
        # vrai service prêt : ajoute ICI, à la main dans Render > Environment,
        # une variable dédiée pour CE service uniquement (ex.
        # VEHICLES_USE_MOCK=false) sans toucher à USE_MOCKS ni aux autres —
        # voir README section 5.
        value: "true"
      - key: VEHICLES_SERVICE_URL
        value: http://localhost:8001
      - key: BOOKING_SERVICE_URL
        value: http://localhost:8002
      - key: PARKING_SERVICE_URL
        value: http://localhost:8003
      - key: PRICING_SERVICE_URL
        value: https://pricing-9khk.onrender.com
      - key: PRICING_USE_MOCK
        value: "false"  # premier service reel branche - voir README section 5
      - key: PAYMENT_SERVICE_URL
        value: http://localhost:8005
      - key: AI_MODEL_NAME
        value: fake-vision-v1
      - key: EVENT_SUBSCRIBERS_URLS
        value: ""
      - key: EVENT_PUBLISH_TIMEOUT_MS
        value: "1000"
      - key: RATE_LIMIT_ACCESS_REQUESTS
        value: "20/minute"
      - key: EVENT_PUBLISHER
        value: rabbitmq
      - key: RABBITMQ_EXCHANGE
        value: microservice-event-bus
      - key: RABBITMQ_URL
        sync: false  # secret : à coller manuellement dans Render > Environment (voir note en haut de fichier)

# --- Ancienne option : RabbitMQ auto-hébergé sur Render (service privé) -----
# Laissée en commentaire — plus utilisée depuis qu'on a un broker externe
# (CloudAMQP) gratuit. Pour y revenir un jour : décommenter ce service, et
# remplacer la valeur de RABBITMQ_URL ci-dessus par
# amqp://guest:guest@access-rabbitmq:5672/%2F (plus besoin de sync: false
# dans ce cas, ce ne serait plus un secret externe).
#
#  - type: pserv
#    name: access-rabbitmq
#    env: image
#    plan: starter
#    region: frankfurt
#    image:
#      url: docker.io/library/rabbitmq:3-management
